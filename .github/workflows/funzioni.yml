name: Funzioni Supabase

# Pubblica la funzione "chiedi" (domande all'IA) su Supabase e le passa la chiave Gemini dedicata.
# Richiede i secret SUPABASE_ACCESS_TOKEN e GEMINI_CHAT_KEY (oltre a SUPABASE_URL).
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/funzioni.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test della funzione
        run: deno test --no-check supabase/functions/chiedi/
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Pubblica
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GEMINI_CHAT_KEY: ${{ secrets.GEMINI_CHAT_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$GEMINI_CHAT_KEY" ]; then
            echo "::warning title=Funzioni::Mancano i secret SUPABASE_ACCESS_TOKEN e/o GEMINI_CHAT_KEY: funzione non pubblicata."
            exit 0
          fi
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([a-z0-9]+)\.supabase\.co.*#\1#')
          printf 'GEMINI_CHAT_KEY=%s\n' "$GEMINI_CHAT_KEY" > .env.funzioni
          supabase secrets set --env-file .env.funzioni --project-ref "$REF"
          rm -f .env.funzioni
          # L'accesso viene verificato dentro la funzione (solo il proprietario del giornale).
          supabase functions deploy chiedi --project-ref "$REF" --use-api --no-verify-jwt
          echo "::notice title=Funzioni::Funzione chiedi pubblicata."
