<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2433" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Il Mio Giornale</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applica tema e dimensione del testo prima del disegno, per evitare lampeggi.
      try {
        const p = JSON.parse(localStorage.getItem('giornale:display') || '{}');
        if (p.theme && p.theme !== 'auto') document.documentElement.dataset.theme = p.theme;
        if (p.size) document.documentElement.dataset.size = p.size;
      } catch (e) {}
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Vai al contenuto</a>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
